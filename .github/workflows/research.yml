name: Art research

# Prints measurements used to match our art to vanilla and to L_Ender's Cataclysm (see
# tools/research/inspect.py). Nothing is uploaded: the numbers are read from the job log.
on:
  push:
    branches: ['claude/**']
    paths: ['tools/research/**', '.github/workflows/research.yml']
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Fetch the 1.21.1 client jar and Cataclysm
        run: |
          url=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | python3 -c "import json,sys; print(next(v['url'] for v in json.load(sys.stdin)['versions'] if v['id']=='1.21.1'))")
          jar=$(curl -s "$url" | python3 -c "import json,sys; print(json.load(sys.stdin)['downloads']['client']['url'])")
          curl -sL -o client.jar "$jar"
          curl -s 'https://api.modrinth.com/v2/project/l_enders-cataclysm/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['files'][0]['url'])" | xargs curl -sL -o cataclysm.jar
          ls -la client.jar cataclysm.jar
      - run: python3 tools/research/inspect.py client.jar cataclysm.jar
      - name: Village mods - find on Modrinth, list structures and tags
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          def get(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "untamed-realms-research"})))
          facets = urllib.parse.quote(json.dumps([["categories:neoforge"], ["versions:1.21.1"]]))
          for q in ["overhauled village", "villages", "medieval village", "towns and towers"]:
              hits = get(f"https://api.modrinth.com/v2/search?query={urllib.parse.quote(q)}&facets={facets}&limit=6")["hits"]
              print(q, "->", [(h["slug"], h["downloads"], h["project_type"]) for h in hits])
          PY
          for slug in ct-overhaul-village lios-overhauled-villages; do
            curl -sf "https://api.modrinth.com/v2/project/$slug/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D" -o v.json || { echo "$slug: not found"; continue; }
            url=$(python3 -c "import json; v=json.load(open('v.json')); print(v[0]['files'][0]['url'] if v else '')")
            [ -n "$url" ] && curl -sL -o "$slug.jar" "$url" && echo "$slug: $url" && python3 tools/research/structures.py "$slug.jar" || echo "$slug: no 1.21.1 neoforge build"
          done
      - name: Distant Horizons - versions for NeoForge 1.21.1
        run: |
          curl -s "https://api.modrinth.com/v2/project/distanthorizons/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D" \
            | python3 -c "import json,sys; [print(v['version_number'], v['date_published'], [d.get('project_id') for d in v['dependencies']]) for v in json.load(sys.stdin)[:3]]"
