name: Modpack

on:
  push:
    paths: ['pack/mods.yml', 'pack/pack.toml', 'pack/config/**', 'tools/pack/**', '.github/workflows/pack.yml', 'server/**']
  workflow_dispatch:
    inputs:
      update:
        description: 'Update every locked mod to its newest NeoForge 1.21.1 build'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve & lock mods
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Resolve manifest
        run: python3 tools/pack/resolve.py ${{ inputs.update && '--update' || '' }}
      - name: Commit lock files
        run: |
          git config user.name "untamed-realms-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pack/
          if git diff --cached --quiet; then
            echo "Pack already up to date."
          else
            git commit -m "Lock modpack (automated packwiz resolve)"
            # other commits may land while we resolve: rebase onto them and retry
            git status --short   # should be empty; a dirty tree (e.g. line endings) blocks the rebase below
            pushed=no
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then pushed=yes; break; fi
              sleep $((i * 5))
            done
            [ "$pushed" = yes ] || { echo "::error::could not push the lock files"; exit 1; }
          fi
      - name: Export Modrinth pack (.mrpack)
        working-directory: pack
        run: packwiz modrinth export -o ../untamed-realms.mrpack
      - uses: actions/upload-artifact@v4
        with:
          name: untamed-realms-mrpack
          path: untamed-realms.mrpack

  bundle:
    name: Windows bundle (with the new lock files)
    needs: resolve
    uses: ./.github/workflows/windows-bundle.yml
    permissions:
      contents: write

  smoke-test:
    name: Boot dedicated server with the full pack
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Pull the freshly locked pack
        run: git pull --ff-only || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Untamed Realms mods
        run: ./gradlew build -x test --stacktrace
      - name: Install server
        run: bash server/scripts/install.sh --dir server-test --pack-dir pack --mods-from mods
      - name: Boot server until "Done", then stop
        run: bash server/scripts/smoke-test.sh server-test 900
      - name: Error digest
        if: always()
        run: |
          f=server-test/logs/latest.log; [ -f "$f" ] || f=server-test/smoke.out
          echo "== mod loading problems =="; grep -nE "Missing or unsupported|requires|is not compatible|Mod File .* needs|failed to load|Failed to create mod instance" "$f" | head -n 40 || true
          echo "== first exceptions =="; grep -nE "Exception|Caused by|ERROR\]" "$f" | grep -v "DEBUG" | head -n 40 || true
          echo "== crash report =="; head -n 60 server-test/crash-reports/*.txt 2>/dev/null || true
          echo "== tail =="; tail -n 25 "$f" || true
      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: |
            server-test/logs/
            server-test/crash-reports/
          if-no-files-found: ignore
