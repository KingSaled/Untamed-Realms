name: Build mods

on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Report latest upstream versions
    runs-on: ubuntu-latest
    steps:
      - name: Latest NeoForge 21.1.x / Parchment 1.21.1
        run: |
          echo "NeoForge 21.1.x (latest 5):"
          curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
            | grep -oE '<version>21\.1\.[0-9]+</version>' | sed -E 's/<\/?version>//g' | sort -t. -k3 -n | tail -5
          echo "Parchment 1.21.1 (latest 3):"
          curl -fsSL https://maven.parchmentmc.org/org/parchmentmc/data/parchment-1.21.1/maven-metadata.xml \
            | grep -oE '<version>[^<]+</version>' | sed -E 's/<\/?version>//g' | tail -3 || true

  art:
    name: ArtForge assets up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: cd tools/artforge && python3 -m artforge check

  build:
    name: Compile & game-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all modules
        run: |
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log
      - name: Compiler errors
        if: failure()
        run: |
          grep -E "error:|What went wrong" -A3 build.log | head -n 250 || true
      - name: Run game tests (headless server, all modules loaded)
        run: |
          set -o pipefail
          ./gradlew :devenv:runGameTestServer 2>&1 | tee gametest.log
      - name: Game-test summary
        if: always()
        run: |
          {
            echo "### Game tests"
            grep -E "Loaded [0-9]+ entries|required tests|GAME TESTS COMPLETE|failed|Failed to load|Exception" gametest.log | sed 's/^/    /' | head -n 80
          } >> "$GITHUB_STEP_SUMMARY" || true
          grep -E "required tests|Failed to load|failed!" gametest.log | head -n 40 || true
      - name: Show game-test log on failure
        if: failure()
        run: tail -n 150 run/gametest/logs/latest.log || true
      - name: Upload mod jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: untamed-realms-mods
          path: mods/*/build/libs/*.jar
          if-no-files-found: ignore
      - name: Upload game-test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: run/gametest/logs/
          if-no-files-found: ignore

  client:
    name: Boot client with the full pack (keybind check)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch the pack's client mods
        run: python3 tools/pack/fetch_mods.py --side client --dest run/client/mods
      - name: Install a virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri
      - name: Boot to the title screen, write the key report, quit
        shell: bash
        timeout-minutes: 30
        env:
          UR_KEY_REPORT: '1'
          UR_EXIT_AFTER_REPORT: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :devenv:runClient --no-daemon > client.log 2>&1 || status=$?
          grep -E "ERROR|FATAL|Exception" client.log | grep -v UR-KEYS | head -60 || true
          test -f run/client/untamedrealms-keys.txt || { tail -150 client.log; exit 1; }
          exit ${status:-0}
      - name: Key report
        if: always()
        shell: bash
        run: |
          f=run/client/untamedrealms-keys.txt
          [ -f "$f" ] || exit 0
          cat "$f"
          { echo "### Key bindings ($(tail -1 "$f"))"; echo '```'; grep -v '^#' "$f" | awk -F' [|] ' '$6 != ""'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          n=$(tail -1 "$f" | grep -oE '[0-9]+$')
          if [ "$n" != "0" ]; then echo "::error::$n key bindings clash in game - fix mods/ur-core/src/main/resources/assets/urcore/keybinds.json"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-boot
          path: |
            client.log
            run/client/untamedrealms-keys.txt
            run/client/logs/
            run/client/crash-reports/
