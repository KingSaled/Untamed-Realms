modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/KingSaled/Untamed-Realms/issues"

[[mods]]
modId = "urtesthub"
version = "${suite_version}"
displayName = "Untamed Realms: Test Hub"
authors = "${mod_authors}"
description = '''
Developer test world. Does nothing in a normal world. When the server is started with Start-Test-World.bat it builds a floating hub with every item, station, NPC, spell and quest laid out, plus a control book of shortcuts.
'''

[[dependencies.urtesthub]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

