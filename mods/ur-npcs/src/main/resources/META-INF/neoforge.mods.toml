modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/KingSaled/Untamed-Realms/issues"

[[mods]]
modId = "urnpcs"
version = "${suite_version}"
displayName = "Untamed Realms: NPCs"
authors = "${mod_authors}"
description = '''
Living towns: named NPCs with branching dialogue, merchants, skill trainers, pickpocketing, and villages that populate themselves with townsfolk and a notice board.
'''

[[dependencies.urnpcs]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.urnpcs]]
modId = "urcore"
type = "required"
versionRange = "[${suite_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.urnpcs]]
modId = "urskills"
type = "required"
versionRange = "[${suite_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.urnpcs]]
modId = "urquests"
type = "required"
versionRange = "[${suite_version},)"
ordering = "AFTER"
side = "BOTH"
