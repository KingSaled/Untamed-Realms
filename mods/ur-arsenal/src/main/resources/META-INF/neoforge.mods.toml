Skyrim's material tiers - Iron, Steel, Orcish, Dwarven, Elven, Glass, Ebony, Daedric - as daggers, swords, war axes, maces, greatswords, battleaxes, warhammers, bows and light & heavy armor, forged at a forge, tanned at a tanning rack and tempered at a workbench, gated by Smithing.
'''

