pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'untamed-realms'

// The Untamed Realms mod suite. Dependency DAG:
//   ur-core  <-  ur-skills  <-  ur-classes
//                    ^   ^------ ur-magic
//   ur-core  <-  ur-quests  <-  ur-npcs (also uses ur-skills)
//   ur-core  <-  ur-skills  <-  ur-arsenal
// devenv is not a mod: it aggregates every module for dev runs and CI game tests.
['ur-core', 'ur-skills', 'ur-classes', 'ur-quests', 'ur-npcs', 'ur-magic', 'ur-arsenal'].each {
    include ":$it"
    project(":$it").projectDir = file("mods/$it")
}
include ':devenv'
project(':devenv').projectDir = file('mods/devenv')
