# Untamed Realms server defaults (copied on first install only).
motd=§6§lUntamed Realms§r §7- an RPG adventure
difficulty=normal
gamemode=survival
pvp=true
max-players=40
online-mode=true
enforce-secure-profile=true
spawn-protection=0
allow-flight=true
# Performance: render 10, simulate 8. ServerCore lowers these further under load.
view-distance=10
simulation-distance=8
entity-broadcast-range-percentage=80
network-compression-threshold=256
sync-chunk-writes=false
max-tick-time=-1
# Worldgen: Terralith + structure mods. Pre-generate with /chunky after first start.
level-type=minecraft\:normal
generate-structures=true
level-name=world
enable-command-block=false
max-world-size=29999984
