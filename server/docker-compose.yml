# Untamed Realms in Docker (itzg/minecraft-server). The image installs NeoForge, then syncs
# server-side mods and config overrides from the packwiz pack on every start.
#
#   1. Put the Untamed Realms jars (ur-*.jar from a release or ./gradlew build) in ./custom-mods
#   2. docker compose up -d
#   3. docker compose exec mc rcon-cli chunky radius 3000   (one-time world pre-generation)
#
# If the GitHub repository is private, PACKWIZ_URL must point somewhere the server can read
# (e.g. a release asset or a self-hosted copy of pack/).
services:
  mc:
    image: itzg/minecraft-server:java21
    container_name: untamed-realms
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.252"
      PACKWIZ_URL: "https://raw.githubusercontent.com/KingSaled/Untamed-Realms/main/pack/pack.toml"
      MEMORY: "10G"
      USE_AIKAR_FLAGS: "true"
      MOTD: "§6§lUntamed Realms§r §7- an RPG adventure"
      DIFFICULTY: normal
      VIEW_DISTANCE: 10
      SIMULATION_DISTANCE: 8
      SPAWN_PROTECTION: 0
      ALLOW_FLIGHT: "TRUE"
      MAX_TICK_TIME: -1
      SYNC_CHUNK_WRITES: "false"
      ENTITY_BROADCAST_RANGE_PERCENTAGE: 80
      ENABLE_RCON: "true"
      COPY_MODS_SRC: /custom-mods
    volumes:
      - ./data:/data
      - ./custom-mods:/custom-mods:ro
